---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: projects.dagmar.denkhaus.io
spec:
  group: dagmar.denkhaus.io
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    shortNames:
    - proj
    singular: project
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is a registered, repo-backed repository dagmar operates
          on.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentPodImage:
                description: |-
                  AgentPodImage is the OCI image the agent pod runs (Phase-0 read, ADR-0012 GAP-1). The
                  field-home (Project spec vs. ConfigMap) is deferred to the control-plane-design seed.
                  Defaults to "alpine:3.20" when empty (runtime-installed kubectl + dagger CLI; cbb8 spike).
                type: string
              gitCredentialsRef:
                description: |-
                  GitCredentialsRef optionally names the Secret holding the PAT the engine uses to fetch
                  this Project's private module ref (ADR-0013 §4 D10 — the resolved #8805 mechanism). When
                  set, the controller projects the token into the agent pod + configures a headless git
                  credential helper; when unset, the module ref is treated as public. Dogfood: dagmar-own
                  carries dagmar-git-creds to read its own now-private module.
                properties:
                  key:
                    description: Key is the key in the Secret holding the PAT/token.
                      Defaults to "token" when empty.
                    type: string
                  name:
                    description: Name is the Secret name, in the Project's (Run's)
                      namespace.
                    type: string
                required:
                - name
                type: object
              moduleRef:
                description: |-
                  ModuleRef is the dagmar module version the agent pod invokes (Phase-0 read, ADR-0012
                  GAP-1), and how it is pointed at the engine on kind vs. production. Deferred to the
                  control-plane-design seed for the exact resolution mechanism.
                type: string
              repo:
                description: |-
                  Repo is the git repository URL dagmar operates on. Informational in Phase 0 (full
                  clone/workspace model is Phase 2); recorded so dagmar-own can be registered as a Project.
                type: string
            required:
            - repo
            type: object
          status:
            description: ProjectStatus holds the observed state of a Project. Minimal
              in Phase 0.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
