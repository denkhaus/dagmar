---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runs.dagmar.denkhaus.io
spec:
  group: dagmar.denkhaus.io
  names:
    kind: Run
    listKind: RunList
    plural: runs
    shortNames:
    - run
    singular: run
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Run is one execution of an Agent, in one Sandbox, on one Workspace — the observable,
          reconciled execution unit (the resource the dagmar controller reconciles).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunSpec defines one execution of an Agent in one Sandbox on one Workspace — the observable,
              reconciled execution unit (CONTEXT.md). Phase 0 carries the module-call the agent pod runs;
              the Agent reference (model/prompt/tool-set) is added in Phase 2 (cognition).
            properties:
              agentRef:
                description: |-
                  AgentRef names the Agent (in the Run's namespace) whose spec configures the
                  code() function call (model, prompt, maxAPICalls, toolSetPolicy).
                  Required for cognition Runs; empty for raw module-call Runs (Phase 0 compat).
                type: string
              moduleArgs:
                description: ModuleArgs are the CLI args passed to the function (e.g.
                  ["--image","alpine:3.20"]).
                items:
                  type: string
                type: array
              moduleFunction:
                description: |-
                  ModuleFunction is the dagmar module function the agent pod calls via `dagger call`
                  (e.g. "code", "sandbox", "probe-net"). Atomic mode (ADR-0016 §2): one function,
                  one agent pod. Mutually exclusive with WorkflowRef.
                type: string
              parentRun:
                description: |-
                  ParentRun is set on Sub-Runs created by an orchestration Run (ADR-0016 §2).
                  Names the orchestration Run that created this atomic Run. Empty on atomic
                  Runs created directly and on orchestration Runs.
                type: string
              projectRef:
                description: ProjectRef names the Project (in the Run's namespace)
                  this Run executes under.
                type: string
              workflowRef:
                description: |-
                  WorkflowRef names the Workflow template for orchestration mode (ADR-0016 §2).
                  When set, the controller orchestrates 1..N atomic Sub-Runs in the pipeline
                  sequence. Mutually exclusive with ModuleFunction.
                type: string
            required:
            - projectRef
            type: object
          status:
            description: |-
              RunStatus holds the observed state of a Run. Phase 0 = status conditions + phase only
              (ADR-0012 §2 SPEC-1: requeue/error-backoff/finalizers deferred to the control-plane-design
              seed).
            properties:
              agentPodName:
                description: AgentPodName is the name of the owned pod executing the
                  module call.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentRound:
                description: CurrentRound is the revise-round counter for orchestration
                  Runs (ADR-0016 §3).
                type: integer
              phase:
                description: |-
                  Phase is the high-level lifecycle phase (Pending|Running|Succeeded|Failed), DERIVED from the
                  condition set via phaseFromConditions (a read-optimized summary for k9s/back-compat; the
                  RunCondition* types are the source of truth, ADR-0013 D5).
                type: string
              pipelinePhase:
                description: |-
                  PipelinePhase tracks orchestration Run progress (ADR-0016 §3).
                  Values: "gate" | "coder" | "review" | "escalated" | "done".
                  Zero-valued on atomic Runs.
                type: string
              subRunRefs:
                description: SubRunRefs names the child Runs created by an orchestration
                  Run (ADR-0016 §3).
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
