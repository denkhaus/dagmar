apiVersion: dagmar.denkhaus.io/v1alpha1
kind: Project
metadata:
  name: dagmar-own
  namespace: default
spec:
  # dagmar develops itself as a registered Project (ADR-0012 dogfooding). Phase 0 carries only
  # the repo + the agent-pod-image / module-ref Phase-0 reads; hook-service/credentials/autonomy come
  # as the control plane grows.
  repo: https://github.com/denkhaus/dagmar
  agentPodImage: alpine:3.20
  # moduleRef: the PROJECT module whose hooks (dagmar-bootstrap, dagmar-gate, dagmar-issues,
  # dagmar-memory) the agent pod loads via WithMainModule (ADR-0012 §2, ADR-0017/0019).
  # For dogfooding this is the .dagmar sub-module — NOT the platform module (.dagger).
  # The pipeline's cognition-run function lives in the platform module (called via -m),
  # but the project hooks it loads for LLM tools come from this ref.
  moduleRef: github.com/denkhaus/dagmar/.dagmar
  # gitCredentialsRef: the repo is PRIVATE (2026-08-04). The engine fetches the module via the
  # #8805 git-credential path (ADR-0013 §4 D10): the controller projects this Secret's PAT into the
  # agent pod and configures a headless git credential helper. Create the Secret from gopass (the
  # PAT is never committed, never on argv): `just git-creds` (fine-grained PAT, contents:read on
  # github.com/denkhaus/dagmar; key dev/dagmar/github_token, see Justfile).
  gitCredentialsRef:
    name: dagmar-git-creds
    key: token
