apiVersion: dagmar.denkhaus.io/v1alpha1
kind: Project
metadata:
  name: dagmar-own
  namespace: default
spec:
  # dagmar develops itself as a registered Project (ADR-0012 dogfooding). Phase 0 carries only
  # the repo + the agent-pod-image / module-ref Phase-0 reads; os-eco/credentials/autonomy come
  # as the control plane grows.
  repo: https://github.com/denkhaus/dagmar
  agentPodImage: alpine:3.20
  # moduleRef: the dagmar module the agent pod invokes via `dagger call -m <ref>` (ADR-0012
  # §2 GAP-1, load-bearing Phase-0 read). The engine fetches the module server-side from this git
  # ref; the pushed repo at main carries probe-net. Dogfood: dagmar calls its own published self.
  moduleRef: github.com/denkhaus/dagmar
  # gitCredentialsRef: the repo is PRIVATE (2026-08-04). The engine fetches the module via the
  # #8805 git-credential path (ADR-0013 §4 D10): the controller projects this Secret's PAT into the
  # agent pod and configures a headless git credential helper. Create the Secret out-of-band
  # (the PAT is never committed): `just git-creds ghp_xxx` (fine-grained PAT, contents:read on
  # github.com/denkhaus/dagmar).
  gitCredentialsRef:
    name: dagmar-git-creds
    key: token
