# Sample LLM credentials Secret for dagmar agent pods.
#
# The controller reads this Secret (name: dagger-llm-config) in the Run's namespace
# and injects the keys as env vars into the agent pod. The Dagger CLI passes them
# to the engine, which uses them for LLM API access.
#
# Place this in the SAME namespace as your Runs (e.g. "default").
# Replace dummy values before applying:
#
#   kubectl apply -f config/samples/dagger-llm-config.sample.yaml -n default
#
# Or create from literals (recommended — avoids committing real keys):
#
#   kubectl create secret generic dagger-llm-config \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#     --from-literal=ANTHROPIC_BASE_URL='http://your-proxy:4000' \
#     -n default
#
# Supported keys (all optional — set only the ones your provider needs):
#
#   ANTHROPIC_API_KEY  — Anthropic API key (or LiteLLM master key when using ANTHROPIC_BASE_URL)
#   ANTHROPIC_BASE_URL — Anthropic-compatible proxy URL (e.g. LiteLLM: http://host:4000)
#   OPENAI_API_KEY     — OpenAI API key (or LiteLLM master key when using OPENAI_BASE_URL)
#   OPENAI_BASE_URL    — OpenAI-compatible proxy URL (e.g. LiteLLM: http://host:4000/v1)

apiVersion: v1
kind: Secret
metadata:
  name: dagger-llm-config
  # namespace: default  # set to the namespace where your Runs live
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-dummy-key-replace-me"
  ANTHROPIC_BASE_URL: "http://your-litellm-proxy:4000"
  # OPENAI_API_KEY: "sk-dummy-key-replace-me"
  # OPENAI_BASE_URL: "http://your-litellm-proxy:4000/v1"
