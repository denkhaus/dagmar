apiVersion: dagmar.denkhaus.io/v1alpha1
kind: Run
metadata:
  name: smoke-sandbox
  namespace: default
spec:
  # A Phase-0 dispatch smoke: the controller provisions an agent pod that calls the dagmar
  # module's sandbox function against the singleton engine (ADR-0012 §2 dispatch vertical).
  # sandbox is LLM-free — it builds a container spec and returns, proving the full dispatch
  # chain (Controller → Pod → Engine → Module) without depending on an LLM provider.
  projectRef: dagmar-own
  moduleFunction: sandbox
  moduleArgs:
    - "--image"
    - "alpine:3.20"
