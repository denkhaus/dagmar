apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      # The RunReconciler provisions the agent pods' OWN identity at runtime (a per-namespace
      # dagmar-agent ServiceAccount + a pods/exec Role/RoleBinding on the engine), so the
      # manager Deployment itself only needs the controller's RBAC (config/rbac/role.yaml —
      # runs/projects/pods/serviceaccounts/roles/rolebindings). This is needed under BOTH
      # `just run` (the agent pod uses its own in-cluster SA, not the controller's kubeconfig
      # identity) and `just deploy`.
      containers:
      - name: manager
        image: controller:latest
        args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
