# dagmar's own CI (Phase 1, ADR-0012 §4) — the always-Dagger gate-family.
#
# ONE job: `dagger call -m .dagmar dagmar-gate --source .` runs ALL manifest checkables
# (build/test/vet/gofmt for all three Go modules + the betterleaks secret scan) in a debian
# container whose mise.toml toolchain dagmar-bootstrap rolls out. The gate-family now lives in
# the project module (.dagmar/, ADR-0014), so the platform invokes it by ref (`-m .dagmar`) —
# the same path any Project's gate is invoked, no shortcuit. mise.toml is the single tool source
# for local dev, CI-direct, and the gate; the gate is the single PR-readiness check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # dagmar's build/test/vet/gofmt + secret scan — the always-Dagger gate (ADR-0012 §4). Every
    # push/PR runs `dagger call -m .dagmar dagmar-gate --source .`, which reads .dagmar/project.yaml
    # and runs the declared checkables in a debian container with the mise.toml toolchain (rolled
    # out by dagmar-bootstrap, Dagger-cached). Same function the coder-Loop reuses in-loop (Phase 2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: dagmar-gate
        uses: dagger/dagger-for-github@v8.4.1
        env:
          # GitHub Actions exposes the token as a secret, not an env var; map it so dagger's
          # `env:GITHUB_TOKEN` address resolves it (dagmar-233c).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Match the engine the module is built against (dagger.json engineVersion v0.21.8).
          version: "0.21.8"
          verb: call
          args: -m .dagmar dagmar-gate --source . --github-token env:GITHUB_TOKEN
